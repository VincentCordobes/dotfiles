monitor.alsa.rules = [
  {
    matches = [
      {
        node.description = "Tiger Lake-LP Smart Sound Technology Audio Controller Digital Microphone"
      }
    ]
    actions = {
      update-props = {
        node.description = "Laptop Microphone",
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic2__source"
      }
    ]
    actions = {
      update-props = {
        node.description = "Headphones Microphone",
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Headphones__sink"
      }
    ]
    actions = {
      update-props = {
        node.description = "Laptop Headphones",
      }
    }
  }
  {
    matches = [
      {
        node.description = "Tiger Lake-LP Smart Sound Technology Audio Controller HDMI / DisplayPort 1 Output"
      }
    ]
    actions = {
      update-props = {
        node.description = "External Speaker",
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink"
      }
    ]
    actions = {
      update-props = {
        node.description = "Laptop Speaker",
      }
    }
  }
]
